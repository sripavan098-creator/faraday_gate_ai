[project]
name = "faraday-gate"
version = "0.1.0"
description = "Zero-egress AI agent firewall for AI coding agents (Snapdragon AI Lab Build & Present Challenge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.50",
]
ast = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]
ai = [
    "onnxruntime>=1.17",
    "numpy>=1.24",
]
egress = [
    "psutil>=5.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Security tooling used by the release gate and CI. Pinned as extras so
    # `pip install -e ".[dev]"` reproduces the documented security review.
    "bandit>=1.7",
    "pip-audit>=2.7",
    # The AST-redaction tests require a grammar. Without these, `.[dev]` yields
    # a red suite: the tests exercise a shipped feature, so they belong on the
    # default developer install rather than behind the `ast` extra alone.
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    # `wrap --execute` tests assert the measured-egress path, which requires
    # psutil. Same reasoning as the grammars above.
    "psutil>=5.9",
]

[project.scripts]
faraday = "faraday.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["faraday*"]

[tool.pytest.ini_options]
# Scope collection to the project test suite. samples/repo is a fake demo
# repository and must not be collected as part of the Faraday Gate tests.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The codebase consistently uses `typing.List` / `typing.Optional` rather than
# PEP 585/604 built-in generics. That is a deliberate style choice, not an
# oversight, so the UP family is off rather than half-applied.
select = ["E", "F", "W", "I", "B"]
ignore = [
    # `raise typer.Exit(...)` inside `except ConfigError` is a control-flow
    # signal that sets the process exit code, not an error being wrapped. The
    # original message is already printed to the console above the raise, so
    # chaining the exception would add no diagnostic value.
    "B904",
    # `typer.Option(...)` in a default argument is the documented Typer idiom.
    # The call happens once at import time.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# AST fixtures are intentionally not valid standalone Python: they reference
# `{user}` and `{SECRET}` to prove the AST redactor preserves f-string
# interpolations. Undefined names here are the point of the fixture.
"tests/fixtures/ast/*.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["faraday"]
# yaml ships no type information by default; see the `dev` extra for stubs.
disable_error_code = ["import-untyped"]
